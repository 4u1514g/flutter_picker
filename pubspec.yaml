name: flutter_picker
description: "A new Flutter package project."
version: 0.0.1
homepage: https://github.com/4u1514g/flutter_picker.git

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: any
  photo_manager_image_provider: any
  image_picker: any
  sliding_up_panel: ^2.0.0+1
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - packages/flutter_picker/assets/camera.png
    - packages/flutter_picker/assets/camera add.png
    - packages/flutter_picker/assets/photo.png